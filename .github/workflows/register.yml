# public.yml — 分发模板（复制到你的仓库 .github/workflows/a.yml）
#
# 用法：
#   1. 新建一个仓库（公开仓库 Actions 免费；私有仓库也行）
#   2. 把本文件内容保存为 .github/workflows/a.yml
#   3. Settings → Secrets and variables → Actions：
#      - Secret  PRIVATE_REPO_ACCESS_KEY = 能读取 xbox-cn/TW_REG_RELEASE_V1 的 PAT
#      API_BASE_URL / API_TOKEN 已写死在源码默认值，无需配置
#   4. Actions → Twitch Register (distributed) → Run workflow
#
# 每个 job 独立一条 WARP 出口，默认 3 线程 × 15 账号 = 45/ job；
# 总账号 = job_count × workers × accounts。

name: Twitch Register (distributed)

on:
  workflow_dispatch:
    inputs:
      job_count:
        description: "并行 job 数（每个 job 一条独立 WARP 出口，1-50）"
        required: false
        default: "1"
      workers:
        description: "每个 job 的线程数"
        required: false
        default: "3"
      accounts:
        description: "每个线程注册账号数"
        required: false
        default: "15"
      domain:
        description: "收信域名（*.xxx 表示每次随机子域）"
        required: false
        default: "*.jsip.us"
      warp_core:
        description: "WARP 协议: awg / masque-h2 / wg / masque（失败自动降级）"
        required: false
        default: "awg"
      rest_every:
        description: "每注册 N 个账号休息一次（0=不休息）"
        required: false
        default: "0"
      rest_sec:
        description: "每次休息秒数"
        required: false
        default: "600"
      upload:
        description: "上传账号: 1=上传（内置 API 配置） 0=只存 artifact"
        required: false
        default: "1"
      probe_only:
        description: "只建立出口 + 真实 Step1 探活，不注册"
        required: false
        default: "0"

concurrency:
  group: twreg-distributed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: 生成 job matrix
        id: gen
        env:
          N: ${{ inputs.job_count }}
        run: |
          M=$(python3 -c "import json,os;n=max(1,min(50,int(os.environ.get('N') or 1)));print(json.dumps(list(range(n))))")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "matrix=$M"

  register:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: code
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: 拉取源仓库（private）
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/TW_REG_RELEASE_V1
          token: ${{ secrets.PRIVATE_REPO_ACCESS_KEY }}
          path: code

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 缓存 xehn 包
        uses: actions/cache@v4
        with:
          path: code/xehn-cache
          key: xehn-cache-v1

      - name: 建立出口（XEHN WARP）并批量注册
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKERS: ${{ inputs.workers }}
          ACCOUNTS: ${{ inputs.accounts }}
          MAIL_API_URL: ${{ vars.MAIL_API_URL || 'https://mail.minecraft.fashion' }}
          MAIL_DOMAINS: ${{ inputs.domain }}
          ENABLE_UPLOAD: ${{ inputs.upload }}
          WORKER_NAME: reg_dist_${{ github.run_id }}_${{ matrix.index }}
          MAX_FAILS: "30"
          EGRESS_ROTATE_AFTER: "3"
          RUYIJS_FIREFOX: "159"
          REST_EVERY: ${{ inputs.rest_every }}
          REST_SEC: ${{ inputs.rest_sec }}
          PROBE_ONLY: ${{ inputs.probe_only }}
        run: |
          # 出口与注册必须在同一步骤：GitHub 会在步骤结束时杀掉后台隧道进程
          ./scripts/setup_egress.ps1 -Core "${{ inputs.warp_core }}" -Port 7890
          if (-not $env:PROXY_SERVER) { Write-Host "::error::WARP egress not ready"; exit 1 }
          if ("${{ inputs.probe_only }}" -eq "1") {
            python scripts/probe_egress.py "$env:PROXY_SERVER"
            exit $LASTEXITCODE
          }
          python batch_run.py --workers "$env:WORKERS" --accounts "$env:ACCOUNTS" `
            --rest-every "$env:REST_EVERY" --rest-sec "$env:REST_SEC"

      - name: 上传账号与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounts-job${{ matrix.index }}-${{ github.run_id }}
          path: |
            code/accounts/
            code/logs/
          retention-days: 14
          if-no-files-found: warn
